<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>인형 도감 시제품</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f6ebee; overflow: hidden; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
      canvas { display: block; }
      #hud { position: fixed; left: 16px; top: 16px; background: rgba(255,255,255,.88); border-radius: 14px; padding: 10px 14px; font-size: 13px; color: #4a3550; max-width: 420px; }
      #hud h1 { font-size: 15px; margin: 0 0 6px; }
      #hud a { display: inline-block; margin: 4px 6px 0 0; padding: 5px 10px; border-radius: 999px; background: #ffc9dd; color: #5a2a4a; text-decoration: none; font-weight: 700; }
      #labels div { position: fixed; transform: translate(-50%, 0); font-size: 13px; font-weight: 700; color: #4a3550; background: rgba(255,255,255,.75); padding: 2px 8px; border-radius: 999px; white-space: nowrap; pointer-events: none; }
      body.shot #hud { display: none; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="labels"></div>
    <script type="module" src="/src/dogam/main.ts"></script>
  </body>
</html>

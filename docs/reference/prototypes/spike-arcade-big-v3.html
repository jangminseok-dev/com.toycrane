<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장난감 스타일 시제품</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1526; font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .tag { position: fixed; top: 12px; left: 12px; background: rgba(59,42,90,.78); color: #fff; font-size: 12px; padding: 6px 12px; border-radius: 999px; }
  .hud { position: fixed; left: 0; right: 0; bottom: 18px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 0 12px; }
  .hud button { border: 0; border-radius: 999px; padding: 11px 16px; font-size: 14px; font-weight: 700; cursor: pointer; background: #fff; color: #3b2a5a; box-shadow: 0 3px 0 #c9b6f2; }
  .hud button.win { background: #ff7ab6; color: #2a0f1f; box-shadow: 0 3px 0 #c74a86; }
  .hud button.rare { background: #ffd36b; color: #3b2a00; box-shadow: 0 3px 0 #c99a2a; }
  .hud button:disabled { opacity: .45; cursor: default; }
  #banner { position: fixed; top: 54px; left: 50%; transform: translateX(-50%) scale(.6); opacity: 0; background: #fff; color: #3b2a5a; font-weight: 800; font-size: 20px; padding: 10px 20px; border-radius: 999px; box-shadow: 0 6px 20px rgba(59,42,90,.25); transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .2s; pointer-events: none; white-space: nowrap; }
  #banner.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #banner.gold { background: #ffd36b; color: #3b2a00; }
  #card { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity .25s; }
  #card.show { opacity: 1; }
  #card .in { width: min(78vw, 300px); padding: 34px 20px 26px; border-radius: 26px; text-align: center; background: radial-gradient(circle at 50% 30%, #fff6c4 0, #ffc25a 35%, #ff6fae 75%, #8a4dff 100%); color: #2a0f1f; box-shadow: 0 20px 60px rgba(59,42,90,.45); transform: scale(.7); transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
  #card.show .in { transform: scale(1); }
  #card .r { display: inline-block; background: #2a0f1f; color: #ffd36b; border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: 13px; }
  #card .n { font-size: 26px; font-weight: 900; margin-top: 12px; }
  #card .s { font-size: 13px; margin-top: 8px; opacity: .8; }
  #card .p { font-size: 11px; margin-top: 14px; opacity: .65; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tag">버리는 시제품 · 50명 매장 · 드래그로 회전 · 휠로 확대</div>
<div id="banner"></div>
<div id="card"><div class="in"><span class="r">★ 희귀 ★</span><div class="n">별빛 토끼</div><div class="s">가방에 넣었어요</div><div class="p">이 카드는 나만 봐요</div></div></div>
<div class="hud">
  <button class="win" data-act="win">뽑기 → 당첨</button>
  <button class="rare" data-act="rare">뽑기 → 희귀 당첨</button>
  <button data-act="fail">뽑기 → 실패</button>
  <button data-act="view">시점: 매장</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- 기본 무대 ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap; // radius로 그림자 가장자리 흐리게

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c1526);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 2.2;
controls.maxDistance = 30;

// 매장 조명: 천장 분홍 네온이 전체를 보랏빛으로 물들이고, 기계 안쪽만 하얗게 밝음
scene.add(new THREE.HemisphereLight(0xf0d0ff, 0x553a6a, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(0.6, 12, 1.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 6;
sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 });
scene.add(sun);
for (const [color, x, z, i] of [[0xff4fd0, -6, -4, 7], [0xff4fd0, 6, -4, 7], [0xff4fd0, -6, 5, 7], [0xff4fd0, 6, 5, 7], [0xfff0e6, 0, 0.5, 5], [0xfff0e6, 3.85, -6, 3]]) {
  const l = new THREE.PointLight(color, i, 0, 2);
  l.position.set(x, 3.1, z);
  scene.add(l);
}

// 만화풍 3단 음영
const gradientMap = new THREE.DataTexture(new Uint8Array([120, 195, 255]), 3, 1, THREE.RedFormat);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
gradientMap.needsUpdate = true;
const matCache = new Map();
const toon = (color) => {
  if (!matCache.has(color)) matCache.set(color, new THREE.MeshToonMaterial({ color, gradientMap }));
  return matCache.get(color);
};
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x3b2a5a, side: THREE.BackSide });
const SPH = new THREE.SphereGeometry(1, 32, 20);
const SPH_LO = new THREE.SphereGeometry(1, 12, 8); // 기계 속 작은 인형용
const cap = (r, l) => new THREE.CapsuleGeometry(r, l, 8, 16);
const CAP_LO = new THREE.CapsuleGeometry(0.075, 0.36, 3, 8);

function part(geo, mat, pos = [0, 0, 0], scl = [1, 1, 1], rot = [0, 0, 0], outline = 1.06) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos); m.scale.set(...scl); m.rotation.set(...rot);
  m.castShadow = true;
  if (outline) { const o = new THREE.Mesh(geo, outlineMat); o.scale.setScalar(outline); m.add(o); }
  return m;
}
const flat = (geo, mat, pos, rot = [0, 0, 0]) => { const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.rotation.set(...rot); return m; };
const noShadow = g => g.traverse(o => { o.castShadow = false; });

// 움직이지 않는 것들은 재질별로 한 덩어리로 합쳐서 그리기 횟수를 줄임 (기계 40대 + 미니 28칸)
function bake(roots) {
  const buckets = new Map();
  for (const root of roots) {
    root.updateMatrixWorld(true);
    root.traverse(o => {
      if (!o.isMesh && !o.isLineSegments) return;
      if (!buckets.has(o.material)) buckets.set(o.material, { line: !!o.isLineSegments, geos: [] });
      buckets.get(o.material).geos.push(o.geometry.clone().applyMatrix4(o.matrixWorld));
    });
    root.parent.remove(root);
  }
  for (const [mat, { line, geos }] of buckets) {
    const list = geos.some(g => !g.index) ? geos.map(g => g.index ? g.toNonIndexed() : g) : geos;
    const merged = mergeGeometries(list);
    if (!merged) { console.warn('합치기 실패', mat); continue; }
    scene.add(line ? new THREE.LineSegments(merged, mat) : new THREE.Mesh(merged, mat));
  }
}

// ---------- 매장 (바닥·벽·천장) ----------
// 벽·천장은 안쪽 면만 그려서, 카메라가 방 밖으로 나가면 그쪽 벽이 저절로 사라짐
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const ROOM = { x0: -11, x1: 11, z0: -9, z1: 9, h: 3.4 };
const RW = ROOM.x1 - ROOM.x0, RD = ROOM.z1 - ROOM.z0;
const RCX = (ROOM.x0 + ROOM.x1) / 2, RCZ = (ROOM.z0 + ROOM.z1) / 2;

// 바닥: 회색 대리석 (큰 판 2.4m, 옅은 결무늬 + 살짝 광택)
const floorTex = canvasTex(1024, 1024, g => {
  g.fillStyle = '#9b97a4'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 70; i++) {
    const x = Math.random() * 1024, y = Math.random() * 1024, r = 80 + Math.random() * 220;
    const c = Math.random() < 0.5 ? '255,255,255' : '55,50,66';
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, `rgba(${c},.07)`); grd.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = grd; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // 결무늬: 같은 방향으로 길게 흐르는 곡선, 넓고 흐린 줄 위에 가는 줄
  for (let i = 0; i < 9; i++) {
    const pts = [[-100, Math.random() * 1024]];
    for (let j = 1; j <= 4; j++) pts.push([j * 300 - 100, pts[j - 1][1] + (Math.random() - 0.35) * 260]);
    for (const [w, a, blur] of [[7, 0.06, 4], [1.4, 0.18 + Math.random() * 0.15, 0.6]]) {
      g.filter = `blur(${blur}px)`;
      g.strokeStyle = `rgba(240,236,246,${a})`; g.lineWidth = w;
      g.beginPath(); g.moveTo(...pts[0]);
      for (let j = 1; j < pts.length; j++) {
        const [px, py] = pts[j - 1], [x, y] = pts[j];
        g.bezierCurveTo(px + 100, py + (Math.random() - 0.5) * 120, x - 100, y + (Math.random() - 0.5) * 120, x, y);
      }
      g.stroke();
    }
  }
  g.filter = 'none';
  g.strokeStyle = 'rgba(40,35,52,.16)'; g.lineWidth = 2; g.strokeRect(0, 0, 1024, 1024);
}, [RW / 2.4, RD / 2.4]);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.32, metalness: 0 }));
floor.rotation.x = -Math.PI / 2;
floor.position.set(RCX, 0, RCZ);
floor.receiveShadow = true;
scene.add(floor);

// 벽·천장: 거의 검은 보라
const drawWall = g => {
  g.fillStyle = '#271e38'; g.fillRect(0, 0, 128, 384);
  g.fillStyle = '#211931'; g.fillRect(0, 0, 4, 384); g.fillRect(64, 0, 4, 384);
  g.fillStyle = '#1a1427'; g.fillRect(0, 368, 128, 16);
};
const wallMat = len => new THREE.MeshLambertMaterial({ map: canvasTex(128, 384, drawWall, [len / 0.8, 1]) });
for (const [len, pos, ry] of [
  [RW, [RCX, ROOM.h / 2, ROOM.z0], 0],
  [RW, [RCX, ROOM.h / 2, ROOM.z1], Math.PI],
  [RD, [ROOM.x0, ROOM.h / 2, RCZ], Math.PI / 2],
  [RD, [ROOM.x1, ROOM.h / 2, RCZ], -Math.PI / 2],
]) {
  const w = new THREE.Mesh(new THREE.PlaneGeometry(len, ROOM.h), wallMat(len));
  w.position.set(...pos); w.rotation.y = ry; w.receiveShadow = true;
  scene.add(w);
}
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD), new THREE.MeshLambertMaterial({ color: 0x1c1526 }));
ceiling.rotation.x = Math.PI / 2;
ceiling.position.set(RCX, ROOM.h, RCZ);
scene.add(ceiling);
// 천장 분홍 네온 줄: 테두리 + 가로지르는 줄
const neonMat = new THREE.MeshBasicMaterial({ color: 0xff5fdc });
const decor = new THREE.Group(); scene.add(decor); // 나중에 한 덩어리로 합칠 고정 장식
const neon = (size, pos) => decor.add(flat(new THREE.BoxGeometry(...size), neonMat, pos));
const NY = ROOM.h - 0.05;
neon([RW - 0.2, 0.05, 0.05], [RCX, NY, ROOM.z0 + 0.1]);
neon([RW - 0.2, 0.05, 0.05], [RCX, NY, ROOM.z1 - 0.1]);
neon([0.05, 0.05, RD - 0.2], [ROOM.x0 + 0.1, NY, RCZ]);
neon([0.05, 0.05, RD - 0.2], [ROOM.x1 - 0.1, NY, RCZ]);
for (const z of [-4.5, 0, 4.5]) neon([RW - 0.2, 0.05, 0.05], [RCX, NY, z]);

// 입구: 앞벽 가운데 유리문 + 발매트
const doorGlass = new THREE.MeshBasicMaterial({ color: 0xbfe8ff, transparent: true, opacity: 0.18, depthWrite: false });
for (const s of [-1, 1]) {
  decor.add(flat(new THREE.PlaneGeometry(1.1, 2.3), doorGlass, [s * 0.58, 1.15, ROOM.z1 - 0.03], [0, Math.PI, 0]));
  decor.add(part(new THREE.BoxGeometry(0.08, 2.4, 0.08), toon(0xd8d0e0), [s * 1.2, 1.2, ROOM.z1 - 0.05], [1, 1, 1], [0, 0, 0], 0));
}
decor.add(part(new THREE.BoxGeometry(2.48, 0.1, 0.08), toon(0xd8d0e0), [0, 2.4, ROOM.z1 - 0.05], [1, 1, 1], [0, 0, 0], 0));
const matTex = canvasTex(512, 256, g => {
  g.fillStyle = '#3b2a5a'; g.fillRect(0, 0, 512, 256);
  g.fillStyle = '#ff9fe8'; g.font = '900 76px -apple-system, "Apple SD Gothic Neo", sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('어서 오세요', 256, 132);
});
decor.add(flat(new THREE.PlaneGeometry(2.4, 1.2), new THREE.MeshLambertMaterial({ map: matTex }), [0, 0.005, ROOM.z1 - 0.8], [-Math.PI / 2, 0, Math.PI]));

// ---------- 인형 (전부 오리지널: 4세트 × 일반 6종 + 세트별 희귀 1종 = 28종) ----------
const pick = a => a[Math.floor(Math.random() * a.length)];
function starTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#b9a4ff'; g.fillRect(0, 0, 256, 256);
  g.fillStyle = '#fff6b0';
  for (let i = 0; i < 46; i++) {
    const x = Math.random() * 256, y = Math.random() * 256, r = 4 + Math.random() * 8;
    g.beginPath();
    for (let j = 0; j < 10; j++) {
      const a = j * Math.PI / 5 - Math.PI / 2, rr = j % 2 ? r * 0.45 : r;
      g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    g.closePath(); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const rainbowTex = canvasTex(64, 256, g => {
  ['#ff6b8b', '#ffa94d', '#ffe066', '#8fdc8a', '#4fd8ff', '#a77bff'].forEach((c, i, a) => { g.fillStyle = c; g.fillRect(0, i * 256 / a.length, 64, 256 / a.length + 1); });
});
const pearlTex = canvasTex(256, 256, g => {
  const grd = g.createLinearGradient(0, 0, 256, 256);
  ['#fdf6ff', '#ffd9ef', '#d9f2ff', '#efe0ff', '#fff3d9'].forEach((c, i, a) => grd.addColorStop(i / (a.length - 1), c));
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
});
// 다람쥐 무늬: 구 UV 기준 x=64가 앞, x=192가 등. 등에 진한 줄·밝은 줄, 얼굴 아래·배는 밝게
const squirrelTex = canvasTex(256, 128, g => {
  g.fillStyle = '#c98a52'; g.fillRect(0, 0, 256, 128);
  g.fillStyle = '#f6e3c8'; g.beginPath(); g.ellipse(64, 80, 46, 40, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#f2dcbc'; for (const dx of [-14, 14]) g.fillRect(192 + dx - 3, 6, 6, 100);
  g.fillStyle = '#5a3a2a'; g.fillRect(188, 0, 8, 112); for (const dx of [-26, 26]) g.fillRect(192 + dx - 3, 12, 6, 90);
  g.fillRect(61, 0, 6, 20);
});
// 굵기가 변하는 관 (다람쥐 꼬리처럼 한 덩어리로 휘는 모양). extra만큼 굵게 만들면 외곽선용
function taperedTube(points, radii, extra = 0, tubular = 24, radial = 12) {
  const curve = new THREE.CatmullRomCurve3(points.map(q => new THREE.Vector3(...q)));
  const geo = new THREE.TubeGeometry(curve, tubular, 1, radial, false);
  const pos = geo.attributes.position, c = new THREE.Vector3(), v = new THREE.Vector3();
  for (let i = 0; i <= tubular; i++) {
    const t = i / tubular, f = t * (radii.length - 1), k = Math.min(Math.floor(f), radii.length - 2);
    const r = radii[k] + (radii[k + 1] - radii[k]) * (f - k) + extra;
    curve.getPointAt(t, c);
    for (let j = 0; j <= radial; j++) {
      const idx = i * (radial + 1) + j;
      v.fromBufferAttribute(pos, idx).sub(c).multiplyScalar(r).add(c);
      pos.setXYZ(idx, v.x, v.y, v.z);
    }
  }
  geo.computeVertexNormals();
  return geo;
}
const TAIL_PTS = [[0, 0.22, -0.2], [0.04, 0.32, -0.46], [0.1, 0.62, -0.6], [0.16, 0.95, -0.55], [0.21, 1.15, -0.42], [0.24, 1.2, -0.24]];
const TAIL_R = [0.07, 0.14, 0.18, 0.18, 0.14, 0.05];
const squirrelTail = {
  hi: taperedTube(TAIL_PTS, TAIL_R), hiLine: taperedTube(TAIL_PTS, TAIL_R, 0.022, 24, 12),
  lo: taperedTube(TAIL_PTS, TAIL_R, 0, 10, 6),
};
const GOLD = new THREE.MeshToonMaterial({ color: 0xffd36b, gradientMap, emissive: 0x7a5200, emissiveIntensity: 0.35 });
// round =몸통 하나짜리 동글이형, feet = 발 색 (없으면 발 없음), wings = 날개·지느러미
const DOLLS = {
  bunny:    { name: '토끼', color: 0xfff4f8 },
  bear:     { name: '곰돌이', color: 0xe8b07a },
  cat:      { name: '고양이', color: 0xffc58f },
  dog:      { name: '강아지', color: 0xfff1dc },
  panda:    { name: '판다', color: 0xffffff },
  hamster:  { name: '햄찌', color: 0xf3d2a2 },
  fox:      { name: '여우', color: 0xff9a52 },
  raccoon:  { name: '너구리', color: 0xb3a59a },
  squirrel: { name: '다람쥐', color: 0xc98a52, mat: new THREE.MeshToonMaterial({ color: 0xffffff, map: squirrelTex, gradientMap }) },
  owl:      { name: '부엉이', color: 0x9a7a5a, round: true, feet: 'orange', wings: true },
  deer:     { name: '아기사슴', color: 0xd9a46a },
  hedgehog: { name: '고슴도치', color: 0xf5dcc0 },
  penguin:  { name: '펭귄', color: 0x4a5a8a, round: true, feet: 'orange', wings: true },
  frog:     { name: '개구리', color: 0x9be36f, round: true, feet: 'body', wings: true },
  duck:     { name: '오리', color: 0xffffff, round: true, feet: 'orange', wings: true },
  seal:     { name: '물범', color: 0xdfe3ea, round: true, wings: true },
  octopus:  { name: '문어', color: 0xff8fb1, round: true },
  whale:    { name: '고래', color: 0x6fa8dc, round: true, wings: true },
  chick:    { name: '병아리', color: 0xffe066, round: true, feet: 'orange', wings: true },
  pig:      { name: '꿀꿀이', color: 0xffc4d6 },
  sheep:    { name: '양', color: 0xffffff },
  cow:      { name: '젖소', color: 0xffffff },
  dino:     { name: '공룡', color: 0x8fdc8a },
  unicorn:  { name: '유니콘', color: 0xfdf4ff },
  rare:         { name: '별빛 토끼', base: 'bunny', mat: new THREE.MeshToonMaterial({ color: 0xffffff, map: starTexture(), gradientMap, emissive: 0x6b4bd6, emissiveIntensity: 0.22 }) },
  goldfox:      { name: '황금 여우', base: 'fox', mat: GOLD },
  pearlpenguin: { name: '진주 펭귄', base: 'penguin', mat: new THREE.MeshToonMaterial({ color: 0xffffff, map: pearlTex, gradientMap, emissive: 0x8a6bd6, emissiveIntensity: 0.18 }) },
  rainbow:      { name: '무지개 공룡', base: 'dino', mat: new THREE.MeshToonMaterial({ color: 0xffffff, map: rainbowTex, gradientMap, emissive: 0x553366, emissiveIntensity: 0.2 }) },
};
const SETS = [
  { name: '말랑 동물', color: '#ff7ab6', kinds: ['bunny', 'bear', 'cat', 'dog', 'panda', 'hamster'], rare: 'rare' },
  { name: '숲속 친구들', color: '#2fbf8f', kinds: ['fox', 'raccoon', 'squirrel', 'owl', 'deer', 'hedgehog'], rare: 'goldfox' },
  { name: '물가 친구들', color: '#3fa8f0', kinds: ['penguin', 'frog', 'duck', 'seal', 'octopus', 'whale'], rare: 'pearlpenguin' },
  { name: '꿈동산 친구들', color: '#9a6bff', kinds: ['chick', 'pig', 'sheep', 'cow', 'dino', 'unicorn'], rare: 'rainbow' },
];
const NORMAL = Object.keys(DOLLS).filter(k => !DOLLS[k].base);
const RARE = Object.keys(DOLLS).filter(k => DOLLS[k].base);
const white = new THREE.MeshBasicMaterial({ color: 0xffffff });
const INK = toon(0x2b1d3f), BLUSH = toon(0xff9ec4), ORANGE = toon(0xff9f43), CREAM = toon(0xfff0dc), PURE = toon(0xffffff);
const UP = new THREE.Vector3(0, 1, 0);
const DG = {
  bunnyEar: cap(0.075, 0.36), bunnyInner: cap(0.04, 0.26), beak: new THREE.ConeGeometry(0.08, 0.16, 10),
  catEar: new THREE.ConeGeometry(0.11, 0.22, 10), foxEar: new THREE.ConeGeometry(0.12, 0.27, 10), smallEar: new THREE.ConeGeometry(0.07, 0.12, 8),
  spike: new THREE.ConeGeometry(0.06, 0.15, 8), dinoTail: new THREE.ConeGeometry(0.12, 0.36, 10), tail: cap(0.05, 0.32),
  snout: new THREE.CylinderGeometry(0.11, 0.11, 0.06, 16), horn: new THREE.ConeGeometry(0.055, 0.28, 10), tentacle: cap(0.07, 0.22),
  crownBand: new THREE.CylinderGeometry(0.15, 0.16, 0.08, 20), crownTip: new THREE.ConeGeometry(0.035, 0.09, 8),
};

const spinners = [];
// lite = 기계 속 무더기용: 면 수를 낮추고 볼터치·눈 반짝이·팔다리 같은 잔부품은 뺌
function makeDoll(kind, lite = false) {
  const d = DOLLS[kind], shape = d.base ?? kind, sd = DOLLS[shape], S = lite ? SPH_LO : SPH;
  const body = d.mat ?? toon(d.color);
  const g = new THREE.Group();
  const OL = lite ? 0 : 1.06; // 잔부품 외곽선
  const p = (geo, mat, pos, scl = [1, 1, 1], rot = [0, 0, 0], ol = 1.06) => { const m = part(geo, mat, pos, scl, rot, ol); g.add(m); return m; };
  const pointed = (geo, mat, pos, dir, scl, ol = OL) => { const m = p(geo, mat, pos, scl, [0, 0, 0], ol); m.quaternion.setFromUnitVectors(UP, dir.normalize()); return m; };
  const eyes = (y, z, dx, bx, bz) => {
    for (const s of [-1, 1]) {
      p(S, INK, [s * dx, y, z], [0.045, 0.055, 0.03], [0, 0, 0], 0);
      if (lite) continue;
      p(S, white, [s * dx + 0.013, y + 0.022, z + 0.022], [0.014, 0.014, 0.01], [0, 0, 0], 0);
      p(S, BLUSH, [s * bx, y - 0.07, bz], [0.05, 0.03, 0.02], [0, 0, 0], 0);
    }
  };
  const nose = (y, z, mat = INK) => p(S, mat, [0, y, z], [0.05, 0.035, 0.035], [0, 0, 0], 0);
  if (sd.round) {
    // 동글이형: 몸통 하나 (문어는 머리를 띄우고 다리 6개)
    if (shape === 'octopus') {
      p(S, body, [0, 0.62, 0], [0.42, 0.45, 0.4]);
      const n = lite ? 4 : 6;
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2 + Math.PI / 6, dx = Math.sin(a), dz = Math.cos(a);
        pointed(lite ? CAP_LO : DG.tentacle, body, [dx * 0.26, 0.14, dz * 0.26], new THREE.Vector3(dx, -0.35, dz), [1, 1, 1], 1.06);
      }
      eyes(0.66, 0.37, 0.15, 0.25, 0.33);
    } else {
      p(S, body, [0, 0.5, 0], [0.45, 0.52, 0.43]);
      if (!lite) for (const s of [-1, 1]) {
        if (sd.wings) p(S, body, [s * 0.43, 0.45, 0.02], [0.1, 0.18, 0.12], [0, 0, -s * 0.5]);
        if (sd.feet) p(S, sd.feet === 'orange' ? ORANGE : body, [s * 0.16, 0.04, 0.14], [0.11, 0.06, 0.14]);
      }
      if (shape === 'chick') {
        p(DG.beak, ORANGE, [0, 0.6, 0.46], [1, 1, 1], [Math.PI / 2, 0, 0], OL);
        if (!lite) for (const dx of [-0.06, 0, 0.06]) p(S, body, [dx, 1.04, -0.02], [0.035, 0.1, 0.035], [0, 0, dx * 5]);
        eyes(0.74, 0.35, 0.15, 0.25, 0.32);
      } else if (shape === 'penguin') {
        p(S, PURE, [0, 0.45, 0.14], [0.34, 0.4, 0.32], [0, 0, 0], 0);
        p(DG.beak, ORANGE, [0, 0.62, 0.46], [1, 0.8, 1], [Math.PI / 2, 0, 0], OL);
        eyes(0.76, 0.37, 0.14, 0.25, 0.33);
      } else if (shape === 'frog') {
        for (const s of [-1, 1]) p(S, body, [s * 0.2, 0.95, 0.12], [0.15, 0.13, 0.15]);
        eyes(0.98, 0.26, 0.2, 0.3, 0.3);
        p(S, BLUSH, [0, 0.58, 0.42], [0.2, 0.03, 0.03], [0, 0, 0], 0);
      } else if (shape === 'owl') {
        p(S, toon(0xd9c2a0), [0, 0.42, 0.18], [0.3, 0.32, 0.28], [0, 0, 0], 0);
        for (const s of [-1, 1]) {
          p(S, PURE, [s * 0.17, 0.72, 0.33], [0.15, 0.15, 0.07], [0, 0, 0], OL);
          p(DG.smallEar, body, [s * 0.24, 1.0, 0], [1, 1, 0.7], [0, 0, -s * 0.35]);
        }
        p(DG.beak, ORANGE, [0, 0.6, 0.41], [0.6, 0.6, 0.6], [Math.PI, 0, 0], 0);
        eyes(0.72, 0.4, 0.17, 0.3, 0.33);
      } else if (shape === 'duck') {
        p(S, ORANGE, [0, 0.6, 0.44], [0.17, 0.05, 0.12], [0, 0, 0], OL);
        if (!lite) p(S, body, [0, 1.04, -0.02], [0.04, 0.09, 0.04]);
        eyes(0.76, 0.36, 0.15, 0.25, 0.32);
      } else if (shape === 'seal') {
        for (const s of [-1, 1]) p(S, PURE, [s * 0.065, 0.6, 0.39], [0.08, 0.065, 0.06], [0, 0, 0], 0);
        nose(0.66, 0.44);
        eyes(0.76, 0.36, 0.17, 0.27, 0.32);
      } else if (shape === 'whale') {
        p(S, toon(0xcfe8ff), [0, 0.4, 0.16], [0.34, 0.3, 0.3], [0, 0, 0], 0);
        for (const s of [-1, 1]) p(S, body, [s * 0.13, 0.95, -0.36], [0.14, 0.05, 0.09], [0, 0, s * 0.4]);
        if (!lite) for (const [x, y] of [[0, 1.1], [-0.07, 1.19], [0.07, 1.19]]) p(S, toon(0x9fe0ff), [x, y, 0.05], [0.04, 0.05, 0.04], [0, 0, 0], 0);
        eyes(0.7, 0.38, 0.17, 0.27, 0.34);
      }
    }
  } else {
    // 서 있는 형: 몸통 + 머리 + 팔다리
    const limb = shape === 'panda' ? INK : body;
    p(S, body, [0, 0.32, 0], [0.33, 0.3, 0.3]);
    p(S, body, [0, 0.8, 0], [0.38, 0.34, 0.34]);
    if (!lite) for (const s of [-1, 1]) {
      p(S, limb, shape === 'squirrel' ? [s * 0.14, 0.44, 0.25] : [s * 0.31, 0.36, 0.06], [0.1, 0.1, 0.1]);
      p(S, limb, [s * 0.15, 0.06, 0.12], [0.12, 0.08, 0.14]);
    }
    const muzzle = (mat) => { p(S, mat, [0, 0.72, 0.27], [0.15, 0.11, 0.09]); nose(0.76, 0.35); };
    let eyeZ = 0.305, eyeY = 0.83;
    for (const s of [-1, 1]) {
      if (shape === 'bunny') {
        const ear = p(lite ? CAP_LO : DG.bunnyEar, body, [s * 0.14, 1.27, -0.02], [1, 1, 1], [0, 0, -s * 0.18]);
        if (!lite) ear.add(part(DG.bunnyInner, toon(0xffb3cf), [0, 0, 0.06], [1, 1, 0.5], [0, 0, 0], 0));
      } else if (shape === 'bear' || shape === 'panda') p(S, shape === 'panda' ? INK : body, [s * 0.27, 1.07, -0.02], [0.12, 0.12, 0.08]);
      else if (shape === 'raccoon') p(S, toon(0x5a4a58), [s * 0.27, 1.05, -0.02], [0.11, 0.11, 0.07]);
      else if (shape === 'cat') p(DG.catEar, body, [s * 0.22, 1.1, 0], [1, 1, 0.6], [0, 0, -s * 0.35]);
      else if (shape === 'fox') p(DG.foxEar, body, [s * 0.21, 1.13, 0], [1, 1, 0.55], [0, 0, -s * 0.3]);
      else if (shape === 'squirrel') p(DG.foxEar, toon(d.color), [s * 0.19, 1.13, -0.02], [0.72, 0.85, 0.5], [0, 0, -s * 0.25]);
      else if (shape === 'dog') p(S, toon(0xc98a5a), [s * 0.37, 0.8, 0], [0.1, 0.2, 0.13], [0, 0, s * 0.25]);
      else if (shape === 'pig') p(DG.smallEar, body, [s * 0.24, 1.08, 0.05], [1, 1, 0.6], [0.5, 0, -s * 0.4]);
      else if (shape === 'deer') p(S, body, [s * 0.34, 0.98, -0.02], [0.15, 0.07, 0.06], [0, 0, s * 0.4]);
      else if (shape === 'sheep' || shape === 'cow') p(S, shape === 'sheep' ? toon(0xf2dcc4) : body, [s * 0.37, 0.88, 0], [0.12, 0.06, 0.06], [0, 0, s * 0.3]);
      else if (shape === 'unicorn') p(DG.smallEar, body, [s * 0.2, 1.09, -0.04], [1, 1, 0.6], [0, 0, -s * 0.3]);
      else if (shape === 'hamster') {
        p(S, toon(0xffb3cf), [s * 0.25, 1.06, 0], [0.08, 0.08, 0.05]);
        p(S, PURE, [s * 0.22, 0.71, 0.18], [0.14, 0.12, 0.12], [0, 0, 0], OL);
      }
    }
    if (shape === 'bear') muzzle(CREAM);
    else if (shape === 'dog' || shape === 'raccoon') muzzle(PURE);
    else if (shape === 'deer') muzzle(CREAM);
    else if (shape === 'panda') {
      for (const s of [-1, 1]) p(S, INK, [s * 0.13, 0.82, 0.285], [0.09, 0.11, 0.05], [0, 0, s * 0.4], 0);
      nose(0.74, 0.33);
    } else if (shape === 'pig') {
      p(DG.snout, BLUSH, [0, 0.74, 0.33], [1, 1, 1], [Math.PI / 2, 0, 0], OL);
      if (!lite) for (const s of [-1, 1]) p(S, INK, [s * 0.04, 0.74, 0.365], [0.02, 0.03, 0.01], [0, 0, 0], 0);
    } else if (shape === 'fox') {
      p(S, PURE, [0, 0.72, 0.24], [0.26, 0.13, 0.12], [0, 0, 0], 0);
      p(S, INK, [0, 0.75, 0.355], [0.04, 0.03, 0.03], [0, 0, 0], 0);
      p(S, body, [0, 0.32, -0.36], [0.14, 0.14, 0.28]);
      if (!lite) p(S, PURE, [0, 0.32, -0.6], [0.08, 0.08, 0.08]);
    } else if (shape === 'cat' || shape === 'hamster') {
      p(S, BLUSH, [0, 0.75, 0.34], [0.035, 0.025, 0.02], [0, 0, 0], 0);
      if (shape === 'cat' && !lite) p(DG.tail, body, [0.16, 0.3, -0.32], [1, 1, 1], [0.7, 0, -0.6]);
    } else if (shape === 'raccoon') {
      // 눈 둘레 검은 띠 + 줄무늬 꼬리
      p(S, toon(0x5a4a58), [0, 0.83, 0.27], [0.3, 0.085, 0.07], [0, 0, 0], 0);
      eyeZ = 0.33;
      p(S, toon(0x5a4a58), [0, 0.3, -0.36], [0.12, 0.12, 0.26]);
      if (!lite) p(S, body, [0, 0.3, -0.47], [0.125, 0.125, 0.06], [0, 0, 0], 0);
    } else if (shape === 'squirrel') {
      // 머리 위로 말려 올라가는 S자 꼬리 + 앞발로 안은 도토리
      nose(0.76, 0.34, BLUSH);
      const tail = new THREE.Mesh(lite ? squirrelTail.lo : squirrelTail.hi, toon(0xb87a48));
      tail.castShadow = true; g.add(tail);
      if (!lite) g.add(new THREE.Mesh(squirrelTail.hiLine, outlineMat));
      if (!lite) {
        p(S, toon(0xb5763c), [0, 0.42, 0.33], [0.075, 0.09, 0.075]);
        p(S, toon(0x7a5230), [0, 0.5, 0.33], [0.085, 0.045, 0.085]);
      }
    } else if (shape === 'deer') {
      if (!lite) for (const s of [-1, 1]) {
        p(S, PURE, [s * 0.16, 1.0, 0.22], [0.035, 0.035, 0.02], [0, 0, 0], 0);
        p(S, PURE, [s * 0.2, 0.42, 0.22], [0.045, 0.045, 0.02], [0, 0, 0], 0);
      }
    } else if (shape === 'hedgehog') {
      // 머리 뒤쪽·몸통 등에 가시
      const spikeMat = toon(0x8a6a5a);
      const head = [[0, 1, -0.3], [0.5, 0.8, -0.4], [-0.5, 0.8, -0.4], [0, 0.6, -0.8], [0.65, 0.4, -0.65], [-0.65, 0.4, -0.65], [0, 0.1, -1], [0.75, 0, -0.6], [-0.75, 0, -0.6]];
      for (const [x, y, z] of lite ? head.slice(0, 5) : head) {
        const dir = new THREE.Vector3(x, y, z).normalize();
        pointed(DG.spike, spikeMat, [dir.x * 0.38, 0.8 + dir.y * 0.34, dir.z * 0.34], dir, [1.3, 1.6, 1.3]);
      }
      if (!lite) for (const [x, y, z] of [[0, 0.3, -1], [0.6, 0.2, -0.8], [-0.6, 0.2, -0.8]]) {
        const dir = new THREE.Vector3(x, y, z).normalize();
        pointed(DG.spike, spikeMat, [dir.x * 0.33, 0.32 + dir.y * 0.3, dir.z * 0.3], dir, [1.3, 1.6, 1.3]);
      }
      nose(0.76, 0.35);
    } else if (shape === 'sheep') {
      // 크림색 얼굴판 + 머리 위 뭉게 털
      p(S, toon(0xf2dcc4), [0, 0.78, 0.17], [0.27, 0.25, 0.2], [0, 0, 0], 0);
      eyeZ = 0.355; eyeY = 0.81;
      for (const [x, z] of lite ? [[-0.1, 0], [0.1, 0]] : [[-0.16, 0.02], [0, 0.08], [0.16, 0.02], [-0.08, -0.12], [0.08, -0.12]]) p(S, body, [x, 1.08, z], [0.12, 0.11, 0.12]);
    } else if (shape === 'cow') {
      const spot = toon(0x3b2a3a);
      for (const [x, y, z, sx, sy] of [[0.15, 0.4, 0.2, 0.1, 0.08], [-0.2, 0.28, 0.14, 0.09, 0.07], [0.2, 0.96, 0.16, 0.1, 0.07], [-0.12, 0.3, -0.24, 0.1, 0.08]]) p(S, spot, [x, y, z], [sx, sy, 0.06], [0, 0, 0], 0);
      p(S, toon(0xffb3c7), [0, 0.7, 0.26], [0.22, 0.12, 0.1]);
      if (!lite) for (const s of [-1, 1]) p(S, INK, [s * 0.07, 0.71, 0.355], [0.02, 0.03, 0.01], [0, 0, 0], 0);
      for (const s of [-1, 1]) p(DG.smallEar, CREAM, [s * 0.17, 1.12, 0], [0.7, 0.9, 0.7], [0, 0, -s * 0.5]);
    } else if (shape === 'dino') {
      const spikeMat = d.base ? GOLD : toon(0xffb84d);
      for (const [y, z, rx] of [[1.15, -0.05, -0.3], [1.0, -0.24, -0.9], [0.62, -0.3, -1.3]]) p(DG.spike, spikeMat, [0, y, z], [1, 1, 0.6], [rx, 0, 0]);
      p(DG.dinoTail, body, [0, 0.2, -0.4], [1, 1, 1], [-1.9, 0, 0]);
    } else if (shape === 'unicorn') {
      // 금색 뿔 + 파스텔 갈기·꼬리
      p(DG.horn, GOLD, [0, 1.17, 0.12], [1, 1, 1], [0.35, 0, 0]);
      const manes = [toon(0xff9fcf), toon(0x9fd8ff), toon(0xffe08a)];
      for (const [i, [y, z]] of [[1.06, -0.12], [0.92, -0.28], [0.72, -0.33]].entries()) p(S, manes[i], [0, y, z], [0.12, 0.12, 0.12]);
      p(S, manes[0], [0, 0.3, -0.36], [0.1, 0.1, 0.22]);
    }
    eyes(eyeY, eyeZ, 0.13, 0.22, 0.255);
  }
  if (d.base) {
    // 희귀: 왕관 + 반짝이
    const crown = new THREE.Group();
    crown.position.set(0, sd.round ? 1.04 : 1.12, 0.04); crown.rotation.x = -0.12;
    crown.add(part(DG.crownBand, GOLD));
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2;
      crown.add(part(DG.crownTip, GOLD, [Math.sin(a) * 0.13, 0.08, Math.cos(a) * 0.13]));
    }
    crown.add(part(S, toon(0xff5fa2), [0, 0.02, 0.155], [0.03, 0.03, 0.02], [0, 0, 0], 0));
    g.add(crown);
    if (!lite) {
      const aura = new THREE.Group(); aura.position.y = 0.7;
      const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffe27a });
      for (let i = 0; i < 7; i++) {
        const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.035), sparkMat);
        const a = i / 7 * Math.PI * 2;
        s.position.set(Math.cos(a) * 0.62, Math.sin(a * 2) * 0.25, Math.sin(a) * 0.62);
        aura.add(s);
      }
      g.add(aura);
      spinners.push({ obj: aura, speed: 1.6 });
    }
  }
  return g;
}

// 유리 칸 바닥에 인형을 무더기로 쌓기. hole = [x, z, 반지름]은 상품 구멍 자리라 비움
function fillDolls(m, { n, w, d, y, s, kinds, detailed = false, hole }) {
  for (let i = 0; i < n; i++) {
    let x, z;
    do { x = (Math.random() - 0.5) * w; z = (Math.random() - 0.5) * d; } while (hole && Math.abs(x - hole[0]) < hole[2] && Math.abs(z - hole[1]) < hole[2]);
    const doll = makeDoll(kinds[i % kinds.length], !detailed);
    doll.scale.setScalar(s);
    doll.position.set(x, y + (i > n * 0.6 ? s * 0.55 : 0), z);
    doll.rotation.set((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 1.4, (Math.random() - 0.5) * 0.5);
    m.add(doll);
  }
}

// ---------- 캐릭터 (손이 떠 있는 스타일) ----------
const hairGeo = new THREE.SphereGeometry(1, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5);
const blobGeo = new THREE.CircleGeometry(0.42, 20);
const blobMat = new THREE.MeshBasicMaterial({ color: 0x120c1c, transparent: true, opacity: 0.28, depthWrite: false });
function makeAvatar({ shirt = 0xff7ab6, hair = 0x5a3a2e, bag = 0x8fd3ff } = {}) {
  const root = new THREE.Group();
  const bob = new THREE.Group(); root.add(bob);
  const skin = toon(0xffe0c8);
  bob.add(part(SPH, toon(shirt), [0, 0.62, 0], [0.36, 0.42, 0.32]));
  const head = new THREE.Group(); head.position.set(0, 1.42, 0); bob.add(head);
  head.add(part(SPH, skin, [0, 0, 0], [0.52, 0.48, 0.48]));
  head.add(part(hairGeo, toon(hair), [0, 0.03, -0.03], [0.55, 0.52, 0.52], [-0.45, 0, 0], 1.04));
  for (const s of [-1, 1]) {
    head.add(part(cap(0.045, 0.06), toon(0x2b1d3f), [s * 0.17, -0.02, 0.45], [1, 1, 0.5], [0, 0, 0], 0));
    head.add(part(SPH, white, [s * 0.17 + 0.015, 0.03, 0.47], [0.016, 0.016, 0.01], [0, 0, 0], 0));
    head.add(part(SPH, toon(0xff9ec4), [s * 0.3, -0.12, 0.365], [0.07, 0.04, 0.02], [0, 0, 0], 0));
  }
  head.add(part(SPH, toon(0x7a3b4f), [0, -0.16, 0.44], [0.04, 0.025, 0.02], [0, 0, 0], 0));
  const backpack = new THREE.Group(); backpack.position.set(0, 0.72, -0.34); bob.add(backpack);
  backpack.add(part(SPH, toon(bag), [0, 0, 0], [0.3, 0.34, 0.17]));
  backpack.add(part(SPH, toon(0xffffff), [0, 0.13, -0.05], [0.24, 0.12, 0.14]));

function fitFont(g, text, size, weight, maxW) {
  const font = () => `${weight} ${size}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
  g.font = font();
  while (g.measureText(text).width > maxW) { size -= 4; g.font = font(); }
  return size;
}
function marqueeTex(text, color, h = 160) {
  return canvasTex(512, h, g => {
    const c = '#' + new THREE.Color(color).getHexString();
    const grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.3, c); grd.addColorStop(1, c);
    g.fillStyle = grd; g.fillRect(0, 0, 512, h);
    const fs = fitFont(g, text, h * 0.5, 900, 450);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineJoin = 'round'; g.lineWidth = fs * 0.18; g.strokeStyle = '#3b2a5a'; g.strokeText(text, 256, h / 2 + 4);
    g.fillStyle = '#ffffff'; g.fillText(text, 256, h / 2 + 4);
  });
}

function walkStep(n, dt, t) {
  n.s += n.speed * n.dir * dt;
  let s = ((n.s % n.loop.total) + n.loop.total) % n.loop.total, seg;
  for (seg of n.loop.segs) { if (s <= seg.len) break; s -= seg.len; }
  const r = n.av.root, nx = -seg.d[1], nz = seg.d[0];
  r.position.x = seg.a[0] + seg.d[0] * s + nx * n.off;
  r.position.z = seg.a[1] + seg.d[1] * s + nz * n.off;
  r.position.y = Math.abs(Math.sin(t * 8 + n.av.phase)) * 0.05;
  const want = faceTo(seg.d[0] * n.dir, seg.d[1] * n.dir);
  let diff = want - r.rotation.y;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  r.rotation.y += diff * Math.min(1, dt * 8);
}

}

  const clawRun = tween(1.7, k => { machine.claw.position.y = machine.clawY0 - Math.sin(k * Math.PI) * 0.75; });
  await pose(me, 0.3, P.chestL, P.chestR);
  await Promise.all([clawRun, tween(1.4, k => { me.bob.rotation.z = Math.sin(k * Math.PI * 6) * 0.07; }, ease.lin)]);
  me.bob.rotation.z = 0;

  if (result === 'fail') {
    await pose(me, 0.45, P.restL, P.restR, k => { r.rotation.y = lerp(Math.PI, 0, k); });
    sfx.fail(); banner('아쉬워…');
    const cloud = makeCloud(); me.head.add(cloud);
    await pose(me, 0.4, P.sadL, P.sadR, k => { me.head.rotation.x = lerp(0, 0.35, k); me.crouch = lerp(0, 0.06, k); });
    await wait(1.3);
    await pose(me, 0.35, P.restL, P.restR, k => { me.head.rotation.x = lerp(0.35, 0, k); me.crouch = lerp(0.06, 0, k); cloud.scale.setScalar(1 - k * 0.99); });
    me.head.remove(cloud); clouds.splice(clouds.indexOf(cloud), 1);
  } else {
    const rare = result === 'rare';
    flashUntil = performance.now() / 1000 + 3.2; flashGold = rare;
    // 꺼내기
    await pose(me, 0.4, P.braceL, P.reachR, k => { me.crouch = lerp(0, 0.18, k); });
    const kind = rare ? 'rare' : pick(NORMAL);
    held = makeDoll(kind); held.scale.setScalar(0.01); r.add(held); holdMode = 'right'; sfx.pop();
    await tween(0.3, k => held.scale.setScalar(lerp(0.01, 0.5, k)), ease.back);
    // 뒤돌아 보여주기
    await pose(me, 0.45, P.holdL, P.holdR, k => { me.crouch = lerp(0.18, 0, k); r.rotation.y = lerp(Math.PI, 0, k); if (k > 0.5) holdMode = 'both'; });
    // 번쩍!
    await pose(me, 0.28, P.upL, P.upR, k => { r.position.y = Math.sin(k * Math.PI) * 0.24; held.scale.setScalar(lerp(0.5, 0.65, k)); }, ease.out);
    r.position.y = 0;
    held.getWorldPosition(tmp); tmp.y += 0.3;
    burst(tmp, rare ? [0xffd36b, 0xfff6b0, 0xff9f43, 0xffffff] : [0xff7ab6, 0x8fd3ff, 0xffe066, 0x8fe3c8], rare ? 80 : 36);
    rare ? sfx.rare() : sfx.win();
    banner(rare ? '★ 희귀! 별빛 토끼' : `짠! ${DOLLS[kind].name}`, rare);
    if (rare) {
      showCard();
      // 희귀는 모두에게: 전광판 알림 + 구경꾼·근처 사람들이 들썩
      drawBoard('★ 희귀 등장! ★', '나 님이 별빛 토끼를 뽑았어요', true);
      setTimeout(() => drawBoard(...BOARD_IDLE), 5000);
      for (const n of npcs) if (n.mode !== 'walk' && (n.mode === 'watch' || n.av.root.position.distanceTo(mainPos) < 6)) setTimeout(() => hop(n.av, 0.2), Math.random() * 400);
    }
    emote(other, rare ? '😱 대박' : '👏');
    hop(other, 0.18);
    await wait(rare ? 1.7 : 1.0);
    // 가방에 쏙
    holdMode = 'right';
    await pose(me, 0.4, P.restL, P.shoulderR, k => { r.rotation.y = lerp(0, Math.PI * 0.78, k); });
    holdMode = 'bag';
    const from = held.position.clone(), s0 = held.scale.x;
    await tween(0.3, k => { held.position.lerpVectors(from, P.bag, k); held.scale.setScalar(lerp(s0, 0.001, k)); }, ease.in);
    r.remove(held); held = null; holdMode = 'none'; sfx.pop(); banner('가방에 쏙!');
    await tween(0.3, k => { const s = Math.sin(k * Math.PI); me.backpack.scale.set(1 + s * 0.25, 1 - s * 0.18, 1 + s * 0.25); });
    await pose(me, 0.4, P.restL, P.restR, k => { r.rotation.y = lerp(Math.PI * 0.78, 0, k); });
  }
  await walk(PLAY_POS, IDLE_POS, r.rotation.y, 0, 0.6);
  setBusy(false);
}

buttons.forEach(b => b.addEventListener('click', () => {
  const a = b.dataset.act;
  if (a === 'view') { if (!busy) goView(VIEW_ORDER[(VIEW_ORDER.indexOf(view) + 1) % VIEW_ORDER.length]); return; }
  play(a);
}));
viewBtn.textContent = `시점: ${VIEWS[view].name}`;

// ---------- 루프 ----------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w / h < 1 ? 62 : 40; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const auto = new URLSearchParams(location.search).get('auto');
if (auto) setTimeout(() => play(auto), 300);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), auto ? 0.5 : 0.05), t = clock.elapsedTime, now = performance.now() / 1000;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt;
    const k = Math.min(tw.t / tw.dur, 1); tw.fn(tw.e(k));
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  for (const n of npcs) {
    if (n.mode === 'walk') walkStep(n, dt, t);
    else if (n.mode === 'play') n.av.baseR.x = P.joyR.x + Math.sin(t * 5 + n.av.phase) * 0.05;
    if (n.mode !== 'walk' && t > n.nextHop) { n.nextHop = t + 10 + Math.random() * 25; if (n.mode === 'play') hop(n.av, 0.12); }
  }
  for (const av of avatars) {
    const s = Math.sin(t * 2.4 + av.phase);
    av.bob.position.y = -av.crouch;
    av.bob.scale.set(1 - s * 0.01, 1 + s * 0.015, 1 - s * 0.01);
    av.handL.position.set(av.baseL.x, av.baseL.y + Math.sin(t * 2.4 + av.phase + 0.8) * 0.025, av.baseL.z);
    av.handR.position.set(av.baseR.x, av.baseR.y + Math.sin(t * 2.4 + av.phase + 1.4) * 0.025, av.baseR.z);
  }
  if (held) {
    if (holdMode === 'right') held.position.copy(me.handR.position).add(tmp.set(0, 0.05, 0.12));
    else if (holdMode === 'both') held.position.copy(me.handL.position).add(me.handR.position).multiplyScalar(0.5).add(tmp.set(0, -0.12, 0.05));
  }
  for (const s of spinners) s.obj.rotation.y += dt * s.speed;
  for (let i = bursts.length - 1; i >= 0; i--) {
    const m = bursts[i], u = m.userData;
    u.life -= dt; u.v.y -= 4.5 * dt;
    m.position.addScaledVector(u.v, dt); m.rotation.x += dt * 6; m.rotation.y += dt * 4;
    m.scale.setScalar(Math.max(u.life, 0));
    if (u.life <= 0) { scene.remove(m); m.material.dispose(); bursts.splice(i, 1); }
  }
  for (const c of clouds) for (const d of c.userData.drops) d.position.y = -0.15 - ((t * 1.2 + d.userData.off) % 1) * 0.5;
  // 당첨된 기계: LED 전부 금색(희귀)/분홍과 흰색으로 번갈아 깜빡, 간판도 반짝
  const flashing = now < flashUntil, blink = Math.floor(t * 10) % 2 === 0;
  machine.leds.forEach((l, i) => { l.material = flashing ? ((i % 2 === 0) === blink ? (flashGold ? LED.gold : LED.hot) : LED.white) : l.userData.base; });
  if (flashing) {
    machine.marquee.color.set(blink ? (flashGold ? 0xffe6a0 : 0xffc2dc) : 0xffffff);
    machine.glow.intensity = blink ? (flashGold ? 9 : 5) : 1.5;
  } else { machine.marquee.color.set(0xffffff); machine.glow.intensity = 0; }
  controls.update();
  renderer.render(scene, camera);
});
</script>

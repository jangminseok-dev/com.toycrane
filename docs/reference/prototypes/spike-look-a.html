<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>그림체 비교 시제품</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f1f7; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { display: block; touch-action: none; }
  .bar { position: fixed; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(255,255,255,.55); backdrop-filter: blur(14px) saturate(1.6); -webkit-backdrop-filter: blur(14px) saturate(1.6); box-shadow: 0 6px 24px rgba(40,20,60,.18), inset 0 1px 0 rgba(255,255,255,.9); }
  #modes { bottom: 72px; } #views { bottom: 16px; }
  .bar button { border: 0; border-radius: 999px; padding: 10px 14px; font: 700 14px -apple-system, "Apple SD Gothic Neo", sans-serif; color: #4a3550; background: transparent; cursor: pointer; white-space: nowrap; }
  .bar button.on { background: linear-gradient(180deg, #ff7ab8, #ff4f9a); color: #fff; box-shadow: 0 2px 10px rgba(255,79,154,.45); }
  #hud { position: fixed; top: 10px; right: 10px; font: 600 12px ui-monospace, Menlo, monospace; color: #4a3550; background: rgba(255,255,255,.65); padding: 6px 10px; border-radius: 10px; }
  #note { position: fixed; top: 10px; left: 10px; max-width: min(380px, 58vw); font-size: 13px; line-height: 1.5; color: #3a2840; background: rgba(255,255,255,.65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 8px 12px; border-radius: 12px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 700 16px -apple-system, sans-serif; color: #7a5a86; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
</head>
<body>
<div id="loading">불러오는 중…</div>
<div id="note"></div>
<div id="hud"></div>
<div class="bar" id="modes"><button data-mode="toon">① 만화 고급화</button><button data-mode="real" class="on">② 실제 재질·조명</button></div>
<div class="bar" id="views"><button data-view="play" class="on">기계 앞 (뽑기 화면)</button><button data-view="figure">피규어 기계</button><button data-view="aisle">매장 통로</button></div>
<script type="module">
// 버리는 시제품: 기계·뽑기는 아주 높은 품질, 매장·캐릭터는 적당한 품질로 두 그림체를 비교한다
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const TEXTS = '대형인형곰돌이왕국토끼마을피규어존말랑친구들펭귄섬신상입고잘뽑혀요오늘의기계회코인게임센터한정인기위컬렉션나다른사람별빛곰돌이주의세이상전용경품종★♪!→0123456789toycrane';
await Promise.race([
  Promise.all([document.fonts.load('80px Jua', TEXTS), document.fonts.load('700 80px Gaegu', TEXTS)]),
  new Promise((r) => setTimeout(r, 3000)),
]).catch(() => {});

const mobile = matchMedia('(pointer: coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.info.autoReset = false;
document.body.appendChild(renderer.domElement);
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f1f7);
scene.fog = new THREE.Fog(0xf4f1f7, 9, 22);
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.03, 60);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------- 재료 ----------
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const WHITE = new THREE.Color(0xffffff);
const cache = new Map();
const G = (key, make) => { if (!cache.has(key)) cache.set(key, make()); return cache.get(key); };
const sphere = (r) => G('s' + r, () => new THREE.SphereGeometry(r, 32, 24));
const rbox = (w, h, d, r = 0.02, s = 4) => G(`b${w}|${h}|${d}|${r}`, () => new RoundedBoxGeometry(w, h, d, s, Math.min(r, Math.min(w, h, d) / 2 - 0.0005)));
const capsule = (r, l) => G(`c${r}|${l}`, () => new THREE.CapsuleGeometry(r, l, 8, 20));
const cyl = (rt, rb, h, n = 32) => G(`y${rt}|${rb}|${h}|${n}`, () => new THREE.CylinderGeometry(rt, rb, h, n));
const plane = (w, h) => G(`p${w}|${h}`, () => new THREE.PlaneGeometry(w, h));
const cone = (r, h) => G(`k${r}|${h}`, () => new THREE.ConeGeometry(r, h, 24));

function tex(w, h, draw, { rep, srgb = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function star(g, x, y, r, fill) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } g.closePath(); g.fillStyle = fill; g.fill(); }
function fitText(g, text, font, size, maxW) { g.font = `${font.replace('$', size)}`; const w = g.measureText(text).width; if (w > maxW) g.font = font.replace('$', Math.floor(size * maxW / w)); }

const fabricBump = tex(256, 256, (g, w, h) => {
  const img = g.createImageData(w, h);
  for (let i = 0; i < w * h; i++) { const v = 170 + rnd() * 85; img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255; }
  g.putImageData(img, 0, 0);
  g.globalAlpha = 0.18; g.strokeStyle = '#000';
  for (let k = -h; k < w; k += 3) { g.beginPath(); g.moveTo(k, 0); g.lineTo(k + h, h); g.stroke(); }
}, { rep: [5, 5], srgb: false });

const toonGrad = (() => { const t = new THREE.DataTexture(new Uint8Array([90, 165, 220, 255]), 4, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: toonGrad, ...extra });
const pair = (real, t) => ({ real, toon: t });
const M = {
  paint: (c) => pair(new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.05 }), toon(c)),
  plastic: (c, r = 0.42) => pair(new THREE.MeshStandardMaterial({ color: c, roughness: r }), toon(c)),
  chrome: (c = 0xeeeef4) => pair(new THREE.MeshStandardMaterial({ color: c, metalness: 1, roughness: 0.13 }), toon(0xd3d6de)),
  fabric: (c) => pair(new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.95, sheen: 1, sheenRoughness: 0.45, sheenColor: new THREE.Color(c).lerp(WHITE, 0.6), bumpMap: fabricBump, bumpScale: 0.9 }), toon(c)),
  felt: (c) => pair(new THREE.MeshStandardMaterial({ color: c, roughness: 1, bumpMap: fabricBump, bumpScale: 0.6 }), toon(c)),
  eye: () => pair(new THREE.MeshPhysicalMaterial({ color: 0x120e16, roughness: 0.05, clearcoat: 1 }), new THREE.MeshBasicMaterial({ color: 0x241c28 })),
  sign: (map, k = 0.75, side = THREE.FrontSide) => pair(new THREE.MeshStandardMaterial({ map, roughness: 0.3, emissive: 0xffffff, emissiveMap: map, emissiveIntensity: k, side }), new THREE.MeshBasicMaterial({ map, side })),
  print: (map, r = 0.55) => pair(new THREE.MeshStandardMaterial({ map, roughness: r }), toon(0xffffff, { map })),
  card: (map) => pair(new THREE.MeshStandardMaterial({ map, roughness: 0.6, alphaTest: 0.5, side: THREE.DoubleSide }), new THREE.MeshBasicMaterial({ map, alphaTest: 0.5, side: THREE.DoubleSide })),
  // 진짜 유리: 바탕은 안 칠하고 비친 빛만 더한다 / 만화: 아주 옅은 하늘빛
  glass: () => pair(new THREE.MeshPhysicalMaterial({ color: 0x000000, roughness: 0.03, envMapIntensity: 0.4, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }),
    new THREE.MeshBasicMaterial({ color: 0xdff3ff, transparent: true, opacity: 0.07, depthWrite: false, side: THREE.DoubleSide })),
};
const glow = (hex, k = 3) => new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k) });

// 만화용 외곽선: 화면에서 일정한 굵기로 부풀린 뒷면
const outlineU = { uW: { value: 0 }, uAsp: { value: 1 } };
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x3b2a3f, side: THREE.BackSide });
outlineMat.onBeforeCompile = (s) => {
  s.uniforms.uW = outlineU.uW; s.uniforms.uAsp = outlineU.uAsp;
  s.vertexShader = 'uniform float uW;\nuniform float uAsp;\n' + s.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
    vec4 nc = projectionMatrix * vec4(normalize(normalMatrix * normal), 0.0);
    vec2 od = nc.xy; float ol = length(od);
    if (ol > 1e-5) { od /= ol; od.x /= uAsp; gl_Position.xy += od * uW * gl_Position.w; }`);
};

const pairs = [], outlines = [], toonOnly = [], realOnly = [];
function mk(geo, mp, { outline = true, cast = true, receive = true } = {}) {
  const isPair = !!(mp && mp.real);
  const m = new THREE.Mesh(geo, isPair ? mp.real : mp);
  m.castShadow = cast; m.receiveShadow = receive;
  if (isPair) {
    pairs.push([m, mp]);
    if (outline) { const o = new THREE.Mesh(geo, outlineMat); o.visible = false; m.add(o); outlines.push(o); }
  }
  return m;
}
function put(parent, obj, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s) {
  obj.position.set(x, y, z); obj.rotation.set(rx, ry, rz); if (s) obj.scale.set(s[0], s[1], s[2]); parent.add(obj); return obj;
}

// ---------- 그림(캔버스) ----------
const signTex = (text, c1, c2) => tex(1024, 320, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, c1); gr.addColorStop(1, c2); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 30; i++) star(g, rnd() * w, rnd() * h, 6 + rnd() * 14, 'rgba(255,255,255,.35)');
  g.lineWidth = 10; g.strokeStyle = 'rgba(255,255,255,.95)'; rr(g, 20, 20, w - 40, h - 40, 44); g.stroke();
  fitText(g, text, '$px Jua, "Apple SD Gothic Neo", sans-serif', 160, w - 140);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = 24; g.strokeStyle = 'rgba(80,20,60,.5)'; g.strokeText(text, w / 2, h / 2 + 10);
  g.fillStyle = '#fff'; g.fillText(text, w / 2, h / 2 + 10);
});
const popTex = (text, bg, fg) => tex(320, 220, (g, w, h) => {
  g.fillStyle = bg; rr(g, 8, 8, w - 16, h - 16, 26); g.fill();
  g.setLineDash([14, 9]); g.lineWidth = 5; g.strokeStyle = fg; rr(g, 24, 24, w - 48, h - 48, 16); g.stroke(); g.setLineDash([]);
  fitText(g, text, '700 $px Gaegu, sans-serif', 92, w - 70);
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 8);
  star(g, 48, 50, 15, fg); star(g, w - 46, h - 46, 11, fg);
});
const backArt = (c1, c2) => tex(512, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, c1); gr.addColorStop(1, c2); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.55)';
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { g.font = '34px sans-serif'; g.fillText(['♥', '★', '●'][(x + y) % 3], x * 64 + (y % 2) * 32 + 8, y * 64 + 44); }
  g.fillStyle = 'rgba(255,255,255,.9)';
  for (const [cx, cy, s] of [[120, 120, 1], [380, 200, 0.8]]) { g.beginPath(); g.arc(cx, cy, 40 * s, 0, 7); g.arc(cx + 45 * s, cy - 15 * s, 50 * s, 0, 7); g.arc(cx + 95 * s, cy, 38 * s, 0, 7); g.fill(); }
});
const tilesT = tex(1024, 1024, (g, w, h) => {
  // 큰 판 대리석: 판마다 밝기를 조금씩 다르게, 회색 결은 부드러운 곡선 여러 겹, 판 사이 가는 줄눈
  for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) {
    const gr = g.createLinearGradient(x * 512, y * 512, x * 512 + 512, y * 512 + 512);
    const base = 236 - ((x + y) % 2) * 6;
    gr.addColorStop(0, `rgb(${base},${base - 1},${base + 3})`); gr.addColorStop(1, `rgb(${base - 10},${base - 11},${base - 6})`);
    g.fillStyle = gr; g.fillRect(x * 512, y * 512, 512, 512);
  }
  const img = g.getImageData(0, 0, w, h);
  for (let i = 0; i < img.data.length; i += 4) { const n = (rnd() - 0.5) * 7; img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n; }
  g.putImageData(img, 0, 0);
  for (let k = 0; k < 26; k++) {
    let x = rnd() * w, y = rnd() * h;
    g.strokeStyle = `rgba(${120 + rnd() * 40},${118 + rnd() * 40},${130 + rnd() * 40},${0.1 + rnd() * 0.25})`;
    g.lineWidth = 0.6 + rnd() * (k < 6 ? 3.2 : 1.4);
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < 6; s++) { const nx = x + (rnd() - 0.3) * 220, ny = y + (rnd() - 0.5) * 160; g.quadraticCurveTo(x + (rnd() - 0.5) * 120, y + (rnd() - 0.5) * 120, nx, ny); x = nx; y = ny; }
    g.stroke();
  }
  g.strokeStyle = 'rgba(150,145,160,.55)'; g.lineWidth = 3;
  for (const k of [0, 512, 1024]) { g.beginPath(); g.moveTo(k, 0); g.lineTo(k, h); g.moveTo(0, k); g.lineTo(w, k); g.stroke(); }
}, { rep: [1.5, 3.5] });
const ceilT = tex(512, 512, (g, w, h) => { g.fillStyle = '#fafafc'; g.fillRect(0, 0, w, h); g.strokeStyle = '#e4e1ea'; g.lineWidth = 3; for (let k = 0; k <= 4; k++) { g.beginPath(); g.moveTo(k * 128, 0); g.lineTo(k * 128, h); g.moveTo(0, k * 128); g.lineTo(w, k * 128); g.stroke(); } }, { rep: [2, 5.25] });
const shadowT = tex(256, 256, (g, w, h) => { const gr = g.createRadialGradient(w / 2, h / 2, 30, w / 2, h / 2, w / 2); gr.addColorStop(0, 'rgba(40,25,50,.5)'); gr.addColorStop(1, 'rgba(40,25,50,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
const shadowMat = new THREE.MeshBasicMaterial({ map: shadowT, transparent: true, depthWrite: false });
const stickerT = tex(256, 128, (g, w, h) => { g.fillStyle = '#fff'; rr(g, 6, 6, w - 12, h - 12, 18); g.fill(); g.lineWidth = 6; g.strokeStyle = '#ff3b5c'; rr(g, 10, 10, w - 20, h - 20, 14); g.stroke(); g.font = '62px Jua, sans-serif'; g.fillStyle = '#ff3b5c'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('1회 🪙1', w / 2, h / 2 + 4); });
const plateT = (t) => tex(256, 110, (g, w, h) => { g.fillStyle = '#26214a'; rr(g, 4, 4, w - 8, h - 8, 20); g.fill(); g.font = '78px Jua, sans-serif'; g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t, w / 2, h / 2 + 4); });
const wallSignT = tex(1024, 512, (g, w, h) => {
  g.fillStyle = '#fbf8ff'; g.fillRect(0, 0, w, h);
  ['#ff3b5c', '#ff9f1c', '#ffd84d', '#22b36b', '#2f7cf6', '#8b5cf6'].forEach((c, i) => { g.fillStyle = c; g.fillRect(0, 380 + i * 14, w, 14); });
  for (let i = 0; i < 24; i++) star(g, rnd() * w, rnd() * 340, 8 + rnd() * 16, ['#ffd84d', '#ff6fb5', '#5ec8ff'][i % 3]);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.font = '170px Jua, sans-serif'; g.lineWidth = 26; g.strokeStyle = '#fff'; g.strokeText('toycrane', w / 2, 150); g.fillStyle = '#ff4f9a'; g.fillText('toycrane', w / 2, 150);
  g.font = '96px Jua, sans-serif'; g.fillStyle = '#4a3a8c'; g.fillText('게임센터', w / 2, 290);
});
const sideWallT = tex(1024, 256, (g, w, h) => {
  g.fillStyle = '#fbf9fd'; g.fillRect(0, 0, w, h);
  ['#ff6fb5', '#ffd84d', '#5ec8ff'].forEach((c, i) => { g.fillStyle = c; g.fillRect(0, 150 + i * 16, w, 16); });
  for (let i = 0; i < 16; i++) star(g, rnd() * w, 40 + rnd() * 90, 10 + rnd() * 10, ['#ff6fb5', '#ffd84d', '#5ec8ff'][i % 3]);
}, { rep: [4, 1] });
function bearArt(g, cx, cy, r, c) {
  g.fillStyle = c; for (const s of [-1, 1]) { g.beginPath(); g.arc(cx + s * r * 0.72, cy - r * 0.72, r * 0.34, 0, 7); g.fill(); }
  g.beginPath(); g.ellipse(cx, cy + r * 1.25, r * 0.78, r * 0.62, 0, 0, 7); g.fill();
  g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
  g.fillStyle = '#fff3f8'; g.beginPath(); g.ellipse(cx, cy + r * 0.28, r * 0.42, r * 0.3, 0, 0, 7); g.fill();
  g.fillStyle = '#2a1e2e'; for (const s of [-1, 1]) { g.beginPath(); g.arc(cx + s * r * 0.36, cy - r * 0.05, r * 0.11, 0, 7); g.fill(); }
  g.beginPath(); g.ellipse(cx, cy + r * 0.18, r * 0.1, r * 0.07, 0, 0, 7); g.fill();
  g.fillStyle = '#fff'; for (const s of [-1, 1]) { g.beginPath(); g.arc(cx + s * r * 0.36 + r * 0.04, cy - r * 0.1, r * 0.035, 0, 7); g.fill(); }
  g.fillStyle = 'rgba(255,120,160,.55)'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * r * 0.62, cy + r * 0.2, r * 0.14, r * 0.08, 0, 0, 7); g.fill(); }
}
// 피규어 상자 앞면: 빛살 배경 + 캐릭터 + 이름 띠 + "1종" 딱지
const figArtT = (w, h, c1, c2, name) => tex(w, h, (g) => {
  const gr = g.createRadialGradient(w / 2, h * 0.42, 10, w / 2, h * 0.42, h * 0.75); gr.addColorStop(0, c1); gr.addColorStop(1, c2); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.save(); g.translate(w / 2, h * 0.42); for (let i = 0; i < 18; i++) { g.rotate(Math.PI / 9); g.fillStyle = 'rgba(255,255,255,.08)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(h, -h * 0.09); g.lineTo(h, h * 0.09); g.fill(); } g.restore();
  for (let i = 0; i < 14; i++) star(g, rnd() * w, rnd() * h * 0.7, 4 + rnd() * 9, 'rgba(255,240,160,.8)');
  bearArt(g, w / 2, h * 0.4, w * 0.2, '#ffc6dc');
  g.fillStyle = 'rgba(255,255,255,.95)'; rr(g, w * 0.07, h * 0.74, w * 0.86, h * 0.19, 18); g.fill();

// 집게: 레일 위 가로대 + 줄 + 캡 + 관절 손가락 3개
function clawRig(ch) {
  const gantry = mk(rbox(0.024, 0.024, D - 0.12, 0.006), ch, { cast: false });
  const carriage = new THREE.Group();
  carriage.add(mk(rbox(0.07, 0.035, 0.07, 0.01), ch));
  const hang = new THREE.Group(); carriage.add(hang);
  const cable = mk(cyl(0.0035, 0.0035, 1, 8), M.plastic(0x2a2a30, 0.3), { outline: false });
  hang.add(cable);
  const head = new THREE.Group(); hang.add(head);
  head.add(mk(cyl(0.03, 0.036, 0.045), ch));
  put(head, mk(cyl(0.043, 0.043, 0.013), M.plastic(0xff4f9a, 0.25)), 0, -0.03, 0);
  put(head, mk(cyl(0.022, 0.024, 0.04), ch), 0, -0.054, 0); // 가는 허브: 귀 사이로 머리 위에 얹힌다
  const points = [];
  const probe = (parent, x, y, z) => { const p = new THREE.Object3D(); p.position.set(x, y, z); parent.add(p); points.push(p); };
  probe(head, 0, -0.074, 0);
  for (let k = 0; k < 4; k++) probe(head, Math.cos(k * Math.PI / 2) * 0.022, -0.074, Math.sin(k * Math.PI / 2) * 0.022);
  for (let k = 0; k < 6; k++) probe(head, Math.cos(k * Math.PI / 3) * 0.043, -0.036, Math.sin(k * Math.PI / 3) * 0.043);
  const fingers = [], fingerPoints = [];
  // 손가락 모양(경첩 기준, x는 바깥쪽): 옆으로 나가 머리 둘레 밖으로 → 곧게 아래로 → 머리 밑 목 쪽으로 안으로 굽는다.
  // 다 오므린(0) 모양이 큰 인형 머리를 감싸는 모양이고, 닿는 데까지만 오므린다
  const P = [[0, 0], [0.077, -0.04], [0.08, -0.15], [0.03, -0.2]];
  for (let k = 0; k < 3; k++) {
    const yaw = new THREE.Group(); yaw.rotation.y = (k * Math.PI * 2) / 3 + Math.PI / 2; head.add(yaw);
    const hinge = new THREE.Group(); hinge.position.set(0.03, -0.04, 0); yaw.add(hinge);
    put(hinge, mk(sphere(0.011), ch), 0, 0, 0);
    for (let n = 0; n < 3; n++) {
      const [x1, y1] = P[n], [x2, y2] = P[n + 1], len = Math.hypot(x2 - x1, y2 - y1);
      put(hinge, mk(rbox(n === 2 ? 0.012 : 0.013, len + 0.008, n === 2 ? 0.016 : 0.018, 0.005), ch), (x1 + x2) / 2, (y1 + y2) / 2, 0, 0, 0, Math.atan2(x2 - x1, y1 - y2));
      if (n < 2) put(hinge, mk(sphere(0.0115), ch), x2, y2, 0);
      for (const f of [0.25, 0.5, 0.75, 1]) probe(hinge, x1 + (x2 - x1) * f, y1 + (y2 - y1) * f, 0);
    }
    put(hinge, mk(sphere(0.011), M.plastic(0xff4f9a, 0.3)), P[3][0], P[3][1], 0, 0, 0, 0, [1, 0.75, 1.3]);
    fingers.push(hinge);
  }
  for (const f of fingers) for (const p of points) if (p.parent === f) fingerPoints.push(p);
  return {
    gantry, carriage, hang, head, points, fingerPoints,
    setOpen(t) { for (const f of fingers) f.rotation.z = THREE.MathUtils.lerp(-0.3, 0.35, t); },
    setDrop(len) { head.position.y = -len; cable.scale.y = len; cable.position.y = -len / 2; },
  };
}

function pose(name) {
  camera.fov = camera.aspect < 1 ? (name === 'aisle' ? 58 : 66) : 46; camera.updateProjectionMatrix();
  if (name === 'play' || name === 'figure') {
    const c = (name === 'play' ? hero : figure).g.getWorldPosition(new THREE.Vector3());
    const look = new THREE.Vector3(c.x, 1.3, c.z);
    const vt = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const dist = Math.min(1.85, Math.max(1.5 / 2 / vt, 1.0 / 2 / (vt * camera.aspect)) + 0.25); // 맞은편 기계 안으로 들어가지 않게
    return { pos: look.clone().add(new THREE.Vector3(1, 0.16, 0.16).normalize().multiplyScalar(dist)), look };
  }
  const back = camera.aspect < 1 ? 1.6 : 0;
  return { pos: new THREE.Vector3(0, 2.9 + back * 0.4, 4.0 + back), look: new THREE.Vector3(0, 0.9, -0.9) };

function touches(margin, pts = rig.points, dolls = hero.dolls) {
  hero.g.updateMatrixWorld(true);
  for (const d of dolls) {
    if (!d.visible || d.parent !== hero.g) continue;
    const sc = d.getWorldScale(tB).x;
    for (const p of pts) {
      p.getWorldPosition(tA);
      for (const [c, r] of d.userData.hits) if (tA.distanceTo(d.localToWorld(tB.copy(c))) < r * sc + margin) return true;
    }
  }
  return false;
}
function bendEars(d, dt) {
  const ears = d.userData.ears;
  if (!ears?.length) return;
  hero.g.updateMatrixWorld(true);
  for (const e of ears) {
    const c = d.localToWorld(tB.copy(e.c));
    let push = 0;
    for (const p of rig.points) { p.getWorldPosition(tA); push = Math.max(push, e.r + 0.006 - tA.distanceTo(c)); }
    const target = d.visible ? Math.min(0.05, push * 1.4) : 0;
    e.cur += (target - e.cur) * Math.min(1, dt * 14);
    e.parts.forEach((p, i) => { p.position.copy(e.base[i]).addScaledVector(e.out, e.cur); p.rotation.z = e.baseRz[i] - Math.sign(e.out.x) * e.cur * 5; });
  }
}
// 인형 위에서 미리 재 본다: 벌린 채 어디까지 내려가면 닿는지, 거기서 어디까지 오므리면 닿는지
function planGrip() {
  const keep = { len: H.len, open: H.open, tilt: rig.hang.rotation.clone() };
  rig.hang.rotation.set(0, 0, 0); rig.setOpen(1);
  let len = 0.08;
  while (len < 0.7) { rig.setDrop(len + 0.003); if (touches(0.004)) break; len += 0.003; }
  rig.setDrop(len); // 닿기 바로 전 높이에서 오므려 본다 (손가락만 잰다 — 허브는 머리 위에 얹혀 있다)
  let close = 0;
  for (let t = 1; t >= 0; t -= 0.01) { rig.setOpen(t); if (touches(0.002, rig.fingerPoints, [prize])) { close = Math.min(1, t + 0.01); break; } }
  rig.setDrop(keep.len); rig.setOpen(keep.open); rig.hang.rotation.copy(keep.tilt);
  return { len, close };
}
const phases = [
  { d: 1.2 },
  { d: 1.7, f: (k) => H.at.lerpVectors(H.home, tgt, ease(k)) },
  { d: 0.5, f: (k) => (H.open = L(0.3, 1, ease(k))) },
  { d: 1.2, start: () => { plan = planGrip(); }, f: (k) => (H.len = L(0.08, plan.len, ease(k))) },
  // 오므리며 머리를 감싸고, 닿는 순간부터 인형이 말랑하게 살짝 눌린다
  { d: 0.7, start: () => { scoop0 = prize.position.y; }, f: (k) => {
    H.open = L(1, plan.close, easeOut(k));
    const grip = Math.max(0, (k - 0.5) / 0.5);
    const sq = grip * 0.04;
    prize.scale.set(1 - sq, 1 + sq * 0.8, 1 - sq);
    prize.position.y = scoop0 + ease(grip) * 0.008;
  }, end: () => rig.head.attach(prize) },
  { d: 0.25 },
  // 들어 올리기: 줄이 무게를 받는 처음은 천천히, 눌림은 들리면서 풀린다
  { d: 1.4, f: (k) => {
    H.len = L(plan.len, 0.08, ease(k));
    const sq = 0.035 * (1 - Math.min(1, k * 2.5));
    prize.scale.set(1 - sq, 1 + sq * 0.8, 1 - sq);
  } },
  { d: 1.7, f: (k) => H.at.lerpVectors(tgt, H.home, ease(k)) },
  { d: 0.7, start: () => { hero.g.attach(prize); fallFrom = prize.position.clone(); }, f: (k) => {
    H.open = L(plan.close, 1, Math.min(1, k * 3));
    const t = k * 0.7; prize.position.y = Math.max(CAB - 0.4, fallFrom.y - 4.9 * t * t); prize.rotation.x += 0.05;
  }, end: () => { prize.visible = false; } },
  { d: 0.6, f: (k) => (H.open = L(1, 0.3, ease(k))) },
  { d: 1.3 },
  { d: 0.35, start: () => { prize.position.copy(prizeHome.p); prize.rotation.copy(prizeHome.r); prize.scale.setScalar(0.01); prize.visible = true; },
    f: (k) => prize.scale.setScalar(Math.max(0.01, 1 + 2.7 * (k - 1) ** 3 + 1.7 * (k - 1) ** 2)) },
];
let pi = 0, pt = 0;
function stepClaw(dt) {
  const ph = phases[pi];
  if (pt === 0 && ph.start) ph.start();
  pt += dt;
  const k = Math.min(1, pt / ph.d);
  ph.f?.(k);
  if (k >= 1) { ph.end?.(); pi = (pi + 1) % phases.length; pt = 0; }
  window.__pi = pi; window.__plan = plan;
  bendEars(prize, dt);
  // 움직임 반대로 기울었다가 출렁이며 돌아오는 흔들림
  if (dt > 0) {
    const vx = (H.at.x - H.prev.x) / dt, vz = (H.at.y - H.prev.y) / dt;
    H.tiltV.x += ((-vx * 0.45 - H.tilt.x) * 26 - H.tiltV.x * 2.6) * dt; H.tilt.x += H.tiltV.x * dt;
    H.tiltV.y += ((vz * 0.45 - H.tilt.y) * 26 - H.tiltV.y * 2.6) * dt; H.tilt.y += H.tiltV.y * dt;
    H.prev.copy(H.at);
  }
  rig.gantry.position.set(H.at.x, TOP - 0.07, 0);
  rig.carriage.position.set(H.at.x, TOP - 0.09, H.at.y);
  rig.hang.rotation.set(H.tilt.y, 0, H.tilt.x);
  rig.setDrop(H.len); rig.setOpen(H.open);
}

// ---------- 그리기 ----------
const hud = document.getElementById('hud');
let last = performance.now(), frames = 0, acc = 0, chaseT = 0, tick = 0;
renderer.setAnimationLoop((now) => {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  stepClaw(dt);
  chaseT += dt; if (chaseT > 0.12) { chaseT = 0; chase(++tick); }
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt / 0.9); const k = ease(camTween.t);
    camera.position.lerpVectors(camTween.p0, camTween.p.pos, k); controls.target.lerpVectors(camTween.l0, camTween.p.look, k);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();
  renderer.info.reset();
  if (mode === 'real') composer.render(); else renderer.render(scene, camera);
  frames++; acc += dt;
  if (acc > 0.5) { hud.textContent = `${Math.round(frames / acc)} fps · 그리기 ${renderer.info.render.calls}회`; frames = 0; acc = 0; }
  document.getElementById('loading')?.remove();
});
</script>
